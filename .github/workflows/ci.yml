name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The reminder scheduler's transient SQLITE_READONLY race (see
        # docs/testing.md 0.6) is Windows-specific; Linux must also stay green
        # so regressions there are caught too.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check app tests
      - name: Compile
        run: python -m compileall -q app tests
      - name: Pytest
        env:
          # Never let CI touch a real database; the pytest guard in
          # tests/conftest.py also refuses non-temp paths.
          DATABASE_PATH: ""
        run: python -m pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Check build output matches served static dir contract
        run: |
          test -f app/static/index.html
          ls app/static/assets/index-*.js app/static/assets/index-*.css
