[project]
name = "personal-ai-os-mvp"
version = "0.3.0"
description = "Local-first personal AI operating system MVP"
requires-python = ">=3.11"
# This MVP is run directly with Uvicorn and is not published as a package.
# Runtime dependencies remain pinned by range in requirements.txt.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pragmatic baseline: correctness (E4/E7/E9/F), import sorting (I), and
# upgradeable patterns (UP). Style-heavy families (BLE/TRY/SIM/...) stay off
# so lint failure always means "fix this", never "reformat that".
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF100"]
# UP017 would rename 99 `datetime.timezone.utc` call sites in one sweep; that is
# churn without behavior gain on 3.11+ and is deliberately left out.
ignore = ["UP017"]
exclude = ["frontend", "temp", "data", "app/static"]
